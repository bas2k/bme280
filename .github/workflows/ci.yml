name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: stable
            runs-on: ubuntu-24.04
            arch: amd64
          - go-version: stable
            runs-on: ubuntu-24.04-arm
            arch: arm64
          - go-version: oldstable
            runs-on: ubuntu-24.04
            arch: amd64
          - go-version: oldstable
            runs-on: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: ./format_check.sh
      - run: go test -coverprofile=coverage.out ./...
      - run: go build ./...
      - name: Upload coverage
        if: matrix.go-version == 'stable' && matrix.arch == 'amd64' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: true

  build-arm32:
    name: Build (Go ${{ matrix.go-version }}, arm)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - stable
          - oldstable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: GOOS=linux GOARCH=arm go build ./...
